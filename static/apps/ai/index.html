 imageMode=next;$('search').checked=!!drafts[next?'image':'chat'].search;$('researchConfig').hidden=!next||!$('search').checked;$('context').hidden=next;$('imageContext').hidden=!next;const draft=drafts[next?'image':'chat'];$('model').value=draft.model;$('prompt').value=draft.prompt;

function endpointURL(address=$('address').value.trim()){
 const url=new URL(address);
 if(url.protocol!=='https:'||url.username||url.password||url.search||url.hash)throw Error(localized('请输入不含凭据或查询参数的 HTTPS 接口地址。', 'Enter an HTTPS endpoint without credentials or query parameters.'));

const approvedOrigins=new Set();
async function approveDestination(address){
 const origin=new URL(address).origin;
 if(approvedOrigins.has(origin))return true;
 const dialog=$('approval');
 $('origin').textContent=origin;
 dialog.returnValue='';
 const choice=new Promise(resolve=>dialog.addEventListener('close',()=>resolve(dialog.returnValue==='send'),{once:true}));

}

function config(search=false){let url;try{url=endpointURL()}catch{throw Error(localized('请输入有效的 HTTPS 接口地址。', 'Enter a valid HTTPS endpoint.'))}const model=$('model').value.trim(),key=$('key').value.trim();if(!model||!key)throw Error(localized('请填写模型名称和 API Key。', 'Enter a model name and API key.'));if(imageMode&&/(^|\/)minimax-m3\.1-flash$/i.test(model))throw Error(localized('MiniMax-M3.1-Flash 仅输出文本，请选择图像生成模型。', 'MiniMax-M3.1-Flash returns text only. Choose an image model.'));const protocol=search?'responses':$('protocol').value;

function lock(value){busy=value;for(const id of ['chat','picture','size','ratio','model','address','key','test','clear','send','search','researchURL','researchModel','researchKey','protocol','limit','timeout','instruction','rounds','imageRounds','artDirection'])$(id).disabled=value}

function showSearchSources(container,output){
 const sources=new Map();
 function collect(source){
   try{
     const url=new URL(source.url);
     if(['https:','http:'].includes(url.protocol))sources.set(url.href,source.title||sources.get(url.href)||url.hostname);
   }catch{}
 }
 let searched=false;
 for(const item of output){
   if(item.type==='web_search_call'){
     if(item.status==='completed')searched=true;
     for(const source of item.action?.sources||[])collect(source);
   }
   for(const part of item.content||[]){
     for(const note of part.annotations||[])if(note.type==='url_citation')collect(note);
   }
 }
 const section=document.createElement('div');section.className='search-links';
 section.textContent=sources.size?localized('网页来源', 'Web sources'):searched?localized('检索已完成，接口未提供来源链接。', 'Search completed without source links.'):localized('接口未返回可验证的检索记录。', 'The endpoint returned no verifiable search record.');
 for(const [href,title] of sources){
   const link=document.createElement('a');link.href=href;link.target='_blank';link.rel='noopener noreferrer';link.textContent=title;
   section.append(document.createElement('br'),link);
 }
 container.append(section);
}

 const path=url.pathname.replace(/\/+$/,'');
 if(/\/(chat\/completions|images\/generations|image_generation)$/.test(path))throw Error(localized('搜索接口需要 Responses 地址。', 'Search requires a Responses endpoint.'));

 if(!model||!key)throw Error(localized('请填写支持网页搜索的模型 ID 和搜索 API Key。', 'Enter a search-capable model ID and search API key.'));

async function imageResearch(service,prompt,signal){
 const response=await fetch(service.address,{method:'POST',redirect:'error',credentials:'omit',signal,
 headers:{Authorization:'Bearer '+service.key,'Content-Type':'application/json'},
 body:JSON.stringify({model:service.model,input:prompt,store:false,tools:[{type:'web_search'}],tool_choice:'required',
 include:['web_search_call.action.sources'],instructions:localized('检索网页，提供与画面相关且有来源支持的可见特征。只返回简洁的视觉事实，限 200 字。', 'Search the web for source-backed visual details relevant to the image. Return concise visual facts in 100 words or fewer.')})});
 if(!response.ok)throw Error(localized('网页检索失败（HTTP ', 'Web search failed (HTTP ')+response.status+localized('），请检查搜索接口、模型权限和密钥。', '). Check the search endpoint, model permissions and key.'));
 const {output=[]}=await response.json();
 if(!output.some(item=>item.type==='web_search_call'&&item.status==='completed'))throw Error(localized('搜索服务未返回已完成的联网检索记录。', 'The service returned no completed web search.'));
 const brief=output.flatMap(item=>item.content||[]).filter(part=>part.type==='output_text').map(part=>part.text).join(' ').trim();
 if(!brief)throw Error(localized('搜索服务未返回可用于绘图的资料。', 'The service returned no usable image references.'));
 return {brief,output};
}

function offerSerialCommand(container,reply){

   if(!command||command.length>1024||/[\x00-\x1f\x7f]/.test(command))continue;
   const button=document.createElement('button');button.type='button';button.textContent=localized('带回串口预览', 'Preview in serial terminal');
   button.onclick=()=>parent.postMessage({type:'serial-draft',command},location.origin);
   container.append(document.createElement('br'),button);break;
 }
}
async function run(test,retryText){if(busy)return;const question=imageMode&&test?localized('白色背景中央的一个黑色圆点。', 'A black dot centered on a white background.'):(retryText??$('prompt').value.trim());if(!test&&!question)return;

 }catch(e){$('note').textContent=e.name==='AbortError'?localized('已停止等待。', 'Stopped waiting.'):e.name==='TimeoutError'?localized('请求超时，请重试。', 'Request timed out. Try again.'):e instanceof TypeError?localized('请求失败，请检查网络及供应商的浏览器跨域设置。', 'Request failed. Check your network and the provider’s CORS settings.'):e.message;
