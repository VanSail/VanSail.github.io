<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝牙探针</title>
<link rel="stylesheet" href="../terminal/terminal.css"><style>#results{overflow-wrap:anywhere}#results code,#results output{display:block}#results article{margin:12px}</style></head>
<body><main><header><h1 id="title"></h1><span class="status" role="status" id="status"></span></header>
<section class="card"><div class="bar"><h2 id="connectionTitle"></h2><button class="primary" id="connect"></button></div>
<div class="fields"><label><span id="label"></span><input id="services" placeholder="180F, 180D"></label></div>
<p class="hint" id="pairHelp"></p><div class="fields"><label><span id="txLabel"></span><select id="tx"></select></label><label><span id="rxLabel"></span><select id="rx"></select></label></div>
<p id="hint" class="hint" role="status"></p><div class="terminal-config"><h2>终端设置</h2><div class="tools"><label>显示 <select id="view"><option value="text">UTF-8 文本</option><option value="hex">HEX · 十六进制</option><option value="bin">BIN · 二进制</option></select></label><button class="utility" id="pause" aria-pressed="false">暂停查看</button><button class="utility" id="clear">清空记录</button></div><div class="tools"><label>输入 <select id="format"><option value="text">UTF-8 文本</option><option value="hex">HEX · 十六进制</option><option value="bin">BIN · 二进制</option></select></label><label>Enter <select id="ending"><option value="cr">CR</option><option value="lf">LF</option><option value="both">CRLF</option><option value="">无</option></select></label><label><input id="echo" type="checkbox"> 本地回显</label><span id="badge"></span></div></div></section><section class="terminal"><div class="bar"><h2>收发终端</h2><span class="count" id="count">RX 0 B · TX 0 B</span></div><div id="screen" aria-label="交互式蓝牙终端"></div></section><details class="card"><summary id="heading"></summary><div id="results"></div></details></main>
<script src="../terminal/xterm.js"></script><script src="../terminal/controls.js"></script><script type="module" src="app.js"></script></body></html>
