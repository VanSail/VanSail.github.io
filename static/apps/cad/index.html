<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD 看图</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">CAD 看图</h1>
        <button id="open" type="button">选择文件</button
        ><input id="file" type="file" accept=".stp,.step,.dxf" hidden />
      </header>
      <div class="layout">
        <details id="structure" hidden>
          <summary id="structureTitle"></summary>
          <div id="items"></div>
        </details>
        <section class="workspace" id="workspace">
          <div id="view"></div>
          <div id="loading" hidden>
            <label for="progress" id="phase"></label>
            <progress id="progress" max="100"></progress>
          </div>
          <div id="empty">
            <strong id="prompt">拖入模型或图纸</strong>
            <p>STP · STEP · DXF</p>
            <small id="local">文件仅在本机处理</small>
          </div>
        </section>
      </div>
      <footer>
        <span id="status" role="status"></span
        ><button id="cancel" hidden></button><button id="fit" hidden></button>
      </footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
