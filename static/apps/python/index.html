<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python 实验室</title></head>
<body><script type="module">
import {retireExamples} from "./retire-examples.js";
const en=new URLSearchParams(location.search).get('lang')==='en';
